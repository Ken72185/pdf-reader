<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>File Hub</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #0f172a;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 16px;
      font-weight: 700;
      font-size: 18px;
      text-align: center;
    }
    main { padding: 14px; }
    .upload {
      background: var(--card);
      border: 1px dashed #334155;
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      margin-bottom: 14px;
    }
    .upload input { display: none; }
    .upload label {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--accent);
      color: #020617;
      font-weight: 600;
      cursor: pointer;
    }
    .files { display: grid; gap: 12px; }
    .file {
      background: var(--card);
      border-radius: 18px;
      padding: 14px;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #020617;
      font-weight: 700;
      font-size: 12px;
    }
    .name {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .size { font-size: 12px; color: var(--muted); }
    .actions { display: flex; gap: 8px; }
    .actions button {
      border: none;
      border-radius: 10px;
      padding: 8px 10px;
      background: #1e293b;
      color: var(--text);
      font-size: 13px;
    }

    /* Preview */
    #preview {
      position: fixed;
      inset: 0;
      background: #020617;
      display: none;
      flex-direction: column;
      z-index: 50;
    }
    #preview header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      font-size: 14px;
      border-bottom: 1px solid #1e293b;
    }
    #previewContent {
      flex: 1;
      overflow: auto;
      background: #020617;
    }
    iframe, embed, img {
      width: 100%;
      height: 100%;
      border: none;
    }
    footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 10px;
    }
  </style>
</head>
<body>
  <header>📁 File Hub</header>
  <main>
    <div class="upload">
      <p>Upload & lihat isi PDF, gambar, dll</p>
      <label>Upload File<input type="file" multiple></label>
    </div>
    <div id="list" class="files"></div>
  </main>
  <footer>Mobile friendly • Preview • Download</footer>

  <div id="preview">
    <header>
      <span id="previewTitle"></span>
      <button onclick="closePreview()">Tutup</button>
    </header>
    <div id="previewContent"></div>
  </div>

  <script>
    const input = document.querySelector('input');
    const list = document.getElementById('list');

    const formatSize = b => b < 1024 ? b+' B' : b < 1048576 ? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(1)+' MB';
    const iconFor = n => {
      const e = n.split('.').pop().toLowerCase();
      if (e==='pdf') return 'PDF';
      if (['jpg','png','jpeg','webp'].includes(e)) return 'IMG';
      if (['xls','xlsx'].includes(e)) return 'XLS';
      if (['doc','docx'].includes(e)) return 'DOC';
      return 'FILE';
    };

    input.onchange = () => {
      [...input.files].forEach(f => {
        const url = URL.createObjectURL(f);
        const div = document.createElement('div');
        div.className = 'file';
        div.innerHTML = `
          <div class="icon">${iconFor(f.name)}</div>
          <div>
            <div class="name">${f.name}</div>
            <div class="size">${formatSize(f.size)}</div>
          </div>
          <div class="actions">
            <button class="previewBtn">👁️</button>
            <button class="downloadBtn">⬇️</button>
          </div>`;

        div.querySelector('.downloadBtn').onclick = () => {
          const a = document.createElement('a');
          a.href = url; a.download = f.name; a.click();
        };

        div.querySelector('.previewBtn').onclick = () => openPreview(f, url);
        list.appendChild(div);
      });
      input.value='';
    };

    function openPreview(file, url) {
      const ext = file.name.split('.').pop().toLowerCase();
      const c = document.getElementById('previewContent');
      c.innerHTML = '';
      document.getElementById('previewTitle').textContent = file.name;

      if (ext === 'pdf') {
        const embed = document.createElement('embed');
        embed.src = url + '#view=FitH';
        embed.type = 'application/pdf';
        c.appendChild(embed);
      } else if (['jpg','jpeg','png','webp'].includes(ext)) {
        const img = document.createElement('img');
        img.src = url;
        img.style.objectFit = 'contain';
        c.appendChild(img);
      } else {
        c.innerHTML = '<p style="padding:16px">Preview di HP terbatas. Silakan download file.</p>';
      }
      document.getElementById('preview').style.display = 'flex';
    }

    function closePreview() {
      document.getElementById('preview').style.display = 'none';
      document.getElementById('previewContent').innerHTML='';
    }
  </script>
</body>
</html>
