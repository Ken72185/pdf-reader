<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>File Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #020617, var(--bg));
      color: var(--text);
    }
    header {
      padding: 16px;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
    }
    .container {
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .upload {
      background: var(--card);
      border: 1px dashed #374151;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .upload input { display: none; }
    .upload label {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 999px;
      background: var(--accent);
      color: #052e16;
      font-weight: 600;
      cursor: pointer;
    }
    .file {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #020617;
      font-weight: 700;
    }
    .meta {
      flex: 1;
      min-width: 0;
    }
    .meta .name {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta .size {
      font-size: 12px;
      color: var(--muted);
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    .actions button {
      border: none;
      border-radius: 10px;
      padding: 8px 10px;
      background: #1f2933;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
    }
    footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 12px;
    }
  </style>
</head>
<body>
  <header>📂 File Hub</header>

  <main class="container">
    <div class="upload">
      <p>Upload PDF, Excel, DOCX, dll</p>
      <label>
        Pilih File
        <input type="file" multiple />
      </label>
    </div>

    <div id="list"></div>
  </main>

  <footer>Mobile‑first • Download • Bagikan</footer>

  <script>
    const input = document.querySelector('input[type=file]');
    const list = document.getElementById('list');

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function iconFor(name) {
      const ext = name.split('.').pop().toLowerCase();
      if (ext === 'pdf') return 'PDF';
      if (['xls', 'xlsx'].includes(ext)) return 'XLS';
      if (['doc', 'docx'].includes(ext)) return 'DOC';
      return 'FILE';
    }

    input.addEventListener('change', () => {
      [...input.files].forEach(file => {
        const url = URL.createObjectURL(file);

        const el = document.createElement('div');
        el.className = 'file';
        el.innerHTML = `
          <div class="icon">${iconFor(file.name)}</div>
          <div class="meta">
            <div class="name">${file.name}</div>
            <div class="size">${formatSize(file.size)}</div>
          </div>
          <div class="actions">
            <button class="download">⬇️</button>
            <button class="share">🔗</button>
          </div>
        `;

        el.querySelector('.download').onclick = () => {
          const a = document.createElement('a');
          a.href = url;
          a.download = file.name;
          a.click();
        };

        el.querySelector('.share').onclick = async () => {
          if (navigator.share) {
            try {
              await navigator.share({
                title: file.name,
                text: 'Bagikan file',
                url
              });
            } catch (e) {}
          } else {
            alert('Share tidak didukung di browser ini');
          }
        };

        list.appendChild(el);
      });
      input.value = '';
    });
  </script>
</body>
</html>
